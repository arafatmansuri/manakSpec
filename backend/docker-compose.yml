version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manakspec-backend
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 so only the local Nginx reverse proxy can reach it directly
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
